[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polynomial-cusps"
version = "0.5.0"
description = "Numerical exploration of a degree-seven parabolic portrait cusp"
requires-python = ">=3.10"
dependencies = ["mpmath>=1.3,<2"]

[project.optional-dependencies]
gui = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.scripts]
polynomial-cusps = "polynomial_cusps.__main__:main"
polynomial-cusps-gui = "polynomial_cusps.gui:main"

[tool.setuptools.packages.find]
include = ["polynomial_cusps*"]

[tool.setuptools.package-data]
polynomial_cusps = ["data/*.json"]
